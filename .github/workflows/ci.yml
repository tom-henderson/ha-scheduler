name: CI

on:
  pull_request:
  push:
    branches: [main, master]

# Allow the release job to create tags/releases and upload assets.
permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Integration tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # PyRIC / mock-open ship un-buildable sdists; install our vendored
          # universal wheels first, then the rest of the harness.
          pip install --find-links ci/wheels \
            pytest-homeassistant-custom-component freezegun
      - name: Run tests
        run: pytest -q

  card:
    name: Card build & smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: card/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      # The card bundle is a build artifact and is no longer committed (it is
      # built here and shipped in the release zip). Build it before the smoke
      # tests, which load it from the integration's frontend path.
      - name: Build card
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Smoke tests
        run: npx playwright test

  release:
    name: Release
    needs: [python-tests, card]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history + tags to derive the version and push back
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: card/package-lock.json
      # Version is owned by CI, not by feature PRs (which no longer touch the
      # manifest). The next version is derived from the latest git tag and
      # patch-bumped; a manifest version that is *ahead* of the latest tag wins,
      # which is how an intentional minor/major bump is requested.
      - name: Compute next version
        id: ver
        run: |
          git fetch --tags --force
          LATEST=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -n1)
          MANIFEST=$(python3 -c "import json;print(json.load(open('custom_components/daily_schedule/manifest.json'))['version'])")
          if [ -z "$LATEST" ]; then
            NEXT="$MANIFEST"
          else
            IFS=. read -r MA MI PA <<<"$LATEST"
            PATCH="$MA.$MI.$((PA + 1))"
            HIGHEST=$(printf '%s\n%s\n' "$LATEST" "$MANIFEST" | sort -V | tail -n1)
            if [ "$HIGHEST" = "$MANIFEST" ] && [ "$MANIFEST" != "$LATEST" ]; then
              NEXT="$MANIFEST" # manifest ahead of tags -> honour a manual minor/major bump
            else
              NEXT="$PATCH"
            fi
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT (latest tag: ${LATEST:-none}, manifest: $MANIFEST)"
      - name: Skip if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Stamp the version into the manifest
        if: steps.check.outputs.exists == 'false'
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("custom_components/daily_schedule/manifest.json")
          data = json.loads(p.read_text())
          data["version"] = "${{ steps.ver.outputs.version }}"
          p.write_text(json.dumps(data, indent=2) + "\n")
          PY
      - name: Build card bundle
        if: steps.check.outputs.exists == 'false'
        working-directory: card
        run: |
          npm ci
          npm run build
      - name: Package the complete built artifact
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p artifacts
          cp custom_components/daily_schedule/frontend/daily-schedule-card.js artifacts/
          # HACS `zip_release` extracts the archive *into* custom_components/daily_schedule,
          # so the zip must hold the integration's files (manifest.json, the built card under
          # frontend/, …) at its root. Zipping the daily_schedule/ folder itself would
          # double-nest to custom_components/daily_schedule/daily_schedule on install.
          (cd custom_components/daily_schedule && zip -r ../../artifacts/daily_schedule.zip . -x '*/__pycache__/*')
      - name: Create release and upload artifacts
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            artifacts/daily_schedule.zip \
            artifacts/daily-schedule-card.js \
            --title "v${{ steps.ver.outputs.version }}" \
            --generate-notes
      # Keep the repo manifest in step with the release. Best-effort: if a branch
      # protection rule blocks the push, the release is still cut (the next run
      # derives from the tag regardless). [skip ci] avoids re-triggering CI.
      - name: Commit the stamped version back to the default branch
        if: steps.check.outputs.exists == 'false'
        continue-on-error: true
        run: |
          if git diff --quiet -- custom_components/daily_schedule/manifest.json; then
            echo "manifest already current; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/daily_schedule/manifest.json
          git commit -m "chore(release): v${{ steps.ver.outputs.version }} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
